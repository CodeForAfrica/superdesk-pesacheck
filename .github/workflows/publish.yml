name: "Publish images"

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component: [server, client]

    steps:
    - uses: actions/checkout@v7

    - uses: docker/login-action@v4.5.2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and push
      env:
        IMAGE: codeforafrica/superdesk-pesacheck-${{ matrix.component }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        docker build \
          --tag "$IMAGE:$TAG" \
          --tag "$IMAGE:latest" \
          ./${{ matrix.component }}
        docker push --all-tags "$IMAGE"
