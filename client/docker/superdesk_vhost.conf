# Static-only vhost. In this deployment the ALB terminates /api, /ws and /capi
# and forwards them straight to the Superdesk server target groups, so the client
# nginx only needs to serve the built SPA. The previous upstream blocks proxied
# to a docker-compose "superdesk-server" host that does not exist here; nginx
# resolves upstream hosts at startup and exited (1) with
#   [emerg] host not found in upstream "superdesk-server:5000"
server {
	server_name "";

	location / {
		root /opt/superdesk/client/dist;
	}
}
