# Client nginx vhost.
#
# This image serves two topologies from one build:
#
#   * Staging/production: an ALB terminates /api, /ws and /capi and forwards
#     them to the Superdesk server target groups. The "superdesk-server" host
#     does not exist inside this container, so the proxy blocks must not be
#     evaluated at startup — otherwise nginx exits(1) with
#       [emerg] host not found in upstream "superdesk-server:5000"
#
#   * Local docker-compose: there is no ALB, so the browser reaches the API,
#     websocket and content API *through* this nginx (the server publishes no
#     host ports of its own). These paths must be proxied to the compose
#     service "superdesk-server".
#
# Both are satisfied by resolving the upstream host lazily: giving proxy_pass a
# variable (instead of a literal upstream/host) defers name resolution to
# request time via `resolver`, so nginx starts cleanly even when the host is
# absent. Where an ALB fronts this origin it terminates these paths before they
# ever reach nginx; where it does not, they proxy to the compose server.
server {
	server_name "";

	root /opt/superdesk/client/dist;

	# Docker's embedded DNS. Lets the variable proxy_pass below resolve the
	# upstream at request time rather than at startup.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# The runtime client config (config.js / config.<hash>.js) is regenerated from
	# the environment on every container start (see docker/start.sh). It is NOT a
	# stable fingerprinted asset, so it must never be cached by browsers or the CDN
	# in front of this origin — otherwise a stale/empty config keeps the browser
	# pointed at localhost after a redeploy.
	location ~ ^/config(\.[a-z0-9]+)?\.js$ {
		add_header Cache-Control "no-store, must-revalidate";
		expires off;
	}

	location /ws {
		set $superdesk_ws superdesk-server:5100;
		proxy_pass http://$superdesk_ws;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_read_timeout 3600;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
	}

	location /capi {
		set $superdesk_capi superdesk-server:5400;
		proxy_pass http://$superdesk_capi;
		proxy_redirect off;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location /api {
		set $superdesk_api superdesk-server:5000;
		proxy_pass http://$superdesk_api;
		proxy_redirect off;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	location / {
	}
}
